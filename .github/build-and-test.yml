name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Monei.slnx

      - name: Build solution
        run: dotnet build Monei.slnx --no-restore -c Release

      - name: Run tests
        run: dotnet test Monei.slnx --no-build -c Release --verbosity normal