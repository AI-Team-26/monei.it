services:
  mongodb:
    image: mongo:8.0
    container_name: monei-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: monei
      MONGO_INITDB_ROOT_PASSWORD: monei-dev-password
    volumes:
      - ./mongo-data:/data/db
