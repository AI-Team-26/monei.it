services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU11-ubuntu-24.04
    restart: unless-stopped
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: monei-Local-Password-1
    volumes:
      - ${SQL_DATA_PATH:?Missed SQL_DATA_PATH}:/var/opt/mssql
      - ${SQL_BACKUP_PATH:?Missed SQL_BACKUP_PATH}:/var/opt/mssql/backup
